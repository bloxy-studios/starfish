name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core — fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (core)
        run: cargo clippy -p starfish-core --all-targets -- -D warnings
      - name: tests (core, incl. gateway e2e vs mock upstream)
        run: cargo test -p starfish-core

  app:
    name: Tauri app — check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (app shell)
        run: cargo check -p starfish

  frontend:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        # The scaffold's bun.lock was written by a newer (canary) bun than the
        # latest stable release, which fails `--frozen-lockfile` with "Unknown
        # lockfile version". Resolve fresh until the lock is regenerated with a
        # stable bun — then switch this back to `bun install --frozen-lockfile`.
        run: |
          rm -f bun.lock
          bun install
      - name: Typecheck & build
        run: bun run build
